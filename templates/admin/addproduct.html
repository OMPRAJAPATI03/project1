{% extends 'admin/layout.html' %}
{% block content %}
<div class="col-lg-6">
                <div class="block">
<div class="title"><strong class="d-block">Add product form</strong><span class="d-block"></span></div>
                  <div class="block-body">
                    <form class="forms-sample" method="POST" action="{{url_for('product_insert')}}" enctype="multipart/form-data">
                        <div class="form-group">
                        <label class="form-control-label">catagory id</label>
                        
                        <select class="form-control" name="category_id" required>
                          {% for j in area %}
                          <option value="{{j[0]}}">{{j[1]}}</option>
                          {% endfor %}
                          </select>                        
                      </div>
                      <div class="form-group">
                        <label class="form-control-label">product Name</label>
                        <input type="text" placeholder="enter name" class="form-control" name="product_name">
                      </div>
                      <div class="form-group">       
                        <label class="form-control-label">product description</label>
                        <input type="text" placeholder="enter description" class="form-control" name="description">
                      </div>
                      <div class="form-group">
                        <label class="form-control-label">weight</label>
                        <input type="text" placeholder="enter name" class="form-control" name="weight">
                      </div>
                      <div class="form-group">
                        <label class="form-control-label">price</label>
                        <input type="text" placeholder="enter name" class="form-control" name="price">
                      </div>
                      <div class="form-group">
                        <label class="form-control-label">image</label>
                        <input type="file" class="form-upload" name="image">
                      </div>
                        <div class="form-group">
                        <label class="form-control-label">status</label>
                        <input type="text" placeholder="enter name" class="form-control" name="status">
                      </div>
                      <div class="form-group">       
                        <input type="submit" value="Save" class="btn btn-primary">
                      </div>
                    </form>
                  </div>
                </div>
              </div>
{% endblock %}
