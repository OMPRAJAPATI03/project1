<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Dark Bootstrap Admin </title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="all,follow">
    <!-- Bootstrap CSS-->
    <link rel="stylesheet" href="/static/admin/vendor/bootstrap/css/bootstrap.min.css">
    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="/static/admin/vendor/font-awesome/css/font-awesome.min.css">
    <!-- Custom Font Icons CSS-->
    <link rel="stylesheet" href="/static/admin/css/font.css">
    <!-- Google fonts - Muli-->
    <link rel="stylesheet" href="/static/admin/https://fonts.googleapis.com/css?family=Muli:300,400,700">
    <!-- theme stylesheet-->
    <link rel="stylesheet" href="/static/admin/css/style.default.css" id="theme-stylesheet">
    <!-- Custom stylesheet - for your changes-->
    <link rel="stylesheet" href="/static/admin/css/custom.css">
    <!-- Favicon-->
    <link rel="shortcut icon" href="/static/admin/img/favicon.ico">
    <!-- Tweaks for older IEs--><!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
        <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script><![endif]-->
  </head>
  <body>
    {% if msg %}
    <script>
      alert("{{msg}}")
    </script>
    {% endif %}
    <div class="login-page">
      <div class="container d-flex align-items-center">
        <div class="form-holder has-shadow">
          <div class="row">
            <!-- Logo & Information Panel-->
            <div class="col-lg-6">
              <div class="info d-flex align-items-center">
                <div class="content">
                  <div class="logo">
                    <h1>Dashboard</h1>
                  </div>
                  <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
                </div>
              </div>
            </div>
            <!-- Form Panel    -->
            <div class="col-lg-6 bg-white">
              <div class="form d-flex align-items-center">
                <div class="content">
                  <form method="POST" class="form-validate"  action="{{url_for('adminlogin1')}}" >
                    
                    <div class="form-group">
                      <input id="login-email" type="email" name="admin_email" required data-msg="Please enter your username" class="input-material">
                      <label for="login-email" class="label-material">email</label>
                    </div>
                    <div class="form-group">
                      <input id="login-password" type="password" name="admin_pass" required data-msg="Please enter your password" class="input-material">
                      <label for="login-password" class="label-material">Password</label>
                    </div>
                    <button
                      type="submit"
                      class="btn btn-primary btn-lg btn-block"
                      tabindex="4"
                      >
                      login
                    </button>
                    <!-- <a id="login" type="submit" class="btn btn-primary btn-lg btn-block" tabindex="4">Login</a> -->
                    <!-- This should be submit button but I replaced it with <a> for demo purposes-->
                  </form><a href="#" class="forgot-pass">Forgot Password?</a><br><small>Do not have an account? </small><a href="register.html" class="signup">Signup</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="copyrights text-center">
         <p>2018 &copy; Your company. Download From <a target="_blank" href="https://templateshub.net">Templates Hub</a>.</p>
      </div>
    </div>
    <!-- JavaScript files-->
    <script src="static/admin/vendor/jquery/jquery.min.js"></script>
    <script src="static/admin/vendor/popper.js/umd/popper.min.js"> </script>
    <script src="static/admin/vendor/bootstrap/js/bootstrap.min.js"></script>
    <script src="static/admin/vendor/jquery.cookie/jquery.cookie.js"> </script>
    <script src="static/admin/vendor/chart.js/Chart.min.js"></script>
    <script src="static/admin/vendor/jquery-validation/jquery.validate.min.js"></script>
    <script src="static/admin/js/front.js"></script>
  </body>
</html>
